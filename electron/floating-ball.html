<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>拾遗悬浮球</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    .ball-container {
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(74, 144, 217, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.3s ease;
      box-shadow: 0 2px 12px rgba(74, 144, 217, 0.3);
      position: relative;
    }

    .ball:hover {
      transform: scale(1.12);
      box-shadow: 0 4px 20px rgba(74, 144, 217, 0.5);
    }

    .ball.drag-over {
      transform: scale(1.2);
      background: rgba(67, 233, 123, 0.85);
      box-shadow: 0 4px 24px rgba(67, 233, 123, 0.5);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .ball-icon {
      font-size: 20px;
      line-height: 1;
      pointer-events: none;
    }

    /* 数量角标 */
    .badge {
      position: absolute;
      top: -2px;
      right: -2px;
      min-width: 16px;
      height: 16px;
      border-radius: 8px;
      background: #ff4444;
      color: white;
      font-size: 10px;
      font-family: "Microsoft YaHei", sans-serif;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      box-shadow: 0 1px 4px rgba(255, 68, 68, 0.4);
      pointer-events: none;
    }

    .badge.visible {
      display: flex;
    }

    /* 拖拽提示环 */
    .drop-ring {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px dashed rgba(67, 233, 123, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      animation: ring-pulse 1s infinite;
    }

    .ball.drag-over ~ .drop-ring {
      display: flex;
    }

    @keyframes ring-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    /* 收录成功闪烁 */
    @keyframes success-flash {
      0% { background: rgba(67, 233, 123, 0.85); }
      100% { background: rgba(74, 144, 217, 0.85); }
    }

    .ball.success {
      animation: success-flash 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="ball-container">
    <div class="ball" id="ball">
      <span class="ball-icon">📋</span>
      <span class="badge" id="badge">0</span>
    </div>
    <div class="drop-ring"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const ball = document.getElementById('ball');
    const badge = document.getElementById('badge');

    // ── 鼠标事件：控制穿透 ──
    ball.addEventListener('mouseenter', () => {
      ipcRenderer.send('ball-mouse-enter');
    });
    ball.addEventListener('mouseleave', () => {
      ipcRenderer.send('ball-mouse-leave');
    });

    // ── 点击打开主窗口 ──
    ball.addEventListener('click', () => {
      ipcRenderer.send('open-dashboard');
    });

    // ── 拖拽收录 ──
    ball.addEventListener('dragenter', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ball.classList.add('drag-over');
      ipcRenderer.send('ball-drag-enter');
    });

    ball.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    ball.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ball.classList.remove('drag-over');
      ipcRenderer.send('ball-drag-leave');
    });

    ball.addEventListener('drop', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ball.classList.remove('drag-over');
      ipcRenderer.send('ball-drag-leave');

      const files = Array.from(e.dataTransfer.files).map(f => f.path).filter(Boolean);
      if (files.length > 0) {
        ipcRenderer.invoke('import-files', { files, source: 'drag-drop' });
        // 收录成功动画
        ball.classList.add('success');
        setTimeout(() => ball.classList.remove('success'), 500);
      }
    });

    // ── 角标更新 ──
    ipcRenderer.on('badge-update', (event, data) => {
      const count = data.count || 0;
      badge.textContent = count > 99 ? '99+' : String(count);
      badge.classList.toggle('visible', count > 0);
    });
  </script>
</body>
</html>
